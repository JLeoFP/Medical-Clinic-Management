# Ambiente local de desenvolvimento (DT-34). Copie .env.example para .env antes de subir.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      CLINICA_APP_SENHA: ${CLINICA_APP_SENHA:?defina CLINICA_APP_SENHA no .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432" # 5432 do host é ocupado pelo wslrelay (WSL) neste ambiente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # interface web
      - "1025:1025" # SMTP

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"

  migrador:
    build:
      context: ./backend
      target: migrador
    environment:
      ConnectionStrings__Clinica: Host=postgres;Database=clinica;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Clinica: Host=postgres;Database=clinica;Username=clinica_api;Password=${CLINICA_APP_SENHA}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
      MediatR__LicenseKey: ${MEDIATR_LICENSE_KEY:-}
      Seq__ServerUrl: http://seq:5341
      NewRelic__ApiKey: ${NEWRELIC_API_KEY:-}
      LuckyPenny__ApiKey: ${LUCKYPENNY_API_KEY:-}
    depends_on:
      migrador:
        condition: service_completed_successfully
      seq:
        condition: service_started
    ports:
      - "5071:8080"
    healthcheck:
      # A imagem aspnet não tem curl: testa /health/ready com /dev/tcp do bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4200/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  dados-postgres:
