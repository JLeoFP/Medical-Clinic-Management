name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Clinica.slnx
      - run: dotnet build Clinica.slnx --no-restore -c Release # warnings são erros (Directory.Build.props)
      - run: dotnet format Clinica.slnx --no-restore --verify-no-changes
      - name: Testes (unitários e integração) com cobertura
        run: >
          dotnet test --solution Clinica.slnx --no-build -c Release
          --coverage --coverage-output-format cobertura
          --results-directory ../cobertura
      - name: Gate de cobertura (80 % em Domain e Application)
        run: node scripts/verificar-cobertura.mjs ../cobertura 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cobertura

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --no-watch
      - run: npm run build
